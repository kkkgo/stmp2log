[workspace]
resolver = "2"
members = [
	"crates/stmp2log",
	"crates/s2l-mail",
	"crates/s2l-store",
	"crates/s2l-smtp",
	"crates/s2l-notify",
	"crates/s2l-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = [
	"net",
	"io-util",
	"sync",
	"time",
	"signal",
	"macros",
	"rt-multi-thread",
	"fs",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

httparse = "1"

sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"

base64 = "0.22"

miniz_oxide = "0.8"

arc-swap = "1"

getrandom = "0.2"

libc = "0.2"

thiserror = "2"

encoding_rs = "0.8"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
mbedtls-sys-auto = { version = "2.28", default-features = false, features = [
    "std",
    "threading",
    "time",
    "legacy_protocols",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
