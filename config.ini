stmp_listen=0.0.0.0:25 #stmp监听端口，为空的时候不启动stmp监听
data=./data #数据目录，为空默认值./data
# 服务端配置，端口为空的时候不开启web服务
web_listen=0.0.0.0:8025 #web服务端端口
web_pass=admin #web服务密码，为空的时候无密码登录
web_path=stmp2log # 后台url服务路径，为空默认为stmp2log

# 推送到另一个stmp2log服务，使用web_pass鉴权和加密传输.推送名用hostname区分
#push_url=http://stmp.example.com:8025/stmp2log

# 下面都是可选项，不写就用默认值。
# Everything below is optional.

# 隐式 TLS 的 SMTP 端口。设备的"加密方式"选 SSL 时填这个。
# 留空表示不开。明文端口上的 STARTTLS 一直可用，不用单独配。
#stmp_tls_listen=0.0.0.0:465

# SMTP 问候语里报的主机名，也是自签证书里的名字和转推时的来源名。
# 默认取系统 hostname。
#stmp_hostname=stmp2log

# SMTP 凭据。两项各自独立生效：
#   都留空（默认）  任意账号密码都放行，设备不做 AUTH 也照收
#   只配 stmp_pass  只校验密码，账号随便报 —— 账号是用来区分设备的
#   只配 stmp_user  只校验账号，密码随便填
# 任意一项配了之后，不做 AUTH 就直接投递的连接会被拒（530）。
# 多一层内网防误投，但绝大多数场景不需要。
#stmp_user=device
#stmp_pass=whatever

# 单封邮件大小上限，支持 512k / 10M 这种写法。
#stmp_maxsize=10M

# 下面四项在 Web 界面的"设置"里也能改，改完会自动写回这个文件
max_entries=5000      # 最多保留条目，超出自动删最旧的
max_days=0            # 最多保留天数，0 表示不按时间删
keep_raw=0            # 保留原始邮件源码
keep_attachments=0    # 保存附件内容（附件很占地方，谨慎开启）
